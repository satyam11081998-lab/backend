[pytest]
# Collect ONLY tests/. Without this, pytest walks the whole repo from the rootdir and
# picks up every file called test_*.py — including two scratch scripts that are not
# tests at all and break collection before the real suite runs:
#
#   scripts/test_env_load.py  calls gdrive._folder_id(), a private helper that no longer
#                             exists, so collection dies with AttributeError.
#   test_run.py               a manual smoke script that FETCHES LIVE NEWS AND CALLS THE
#                             AI PROVIDER at import time. Collecting it is not just noisy,
#                             it spends money and hits the daily budget guard.
#
# Both are kept because they are useful to run by hand (`python scripts/test_env_load.py`).
# They are simply not part of the suite.
testpaths = tests
# Disable pytest cacheprovider because Windows permissions on .pytest_cache may be restricted
addopts = -p no:cacheprovider

